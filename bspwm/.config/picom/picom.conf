# picom: blur behind see-through windows (rofi menus, the terminal), rounded corners and fades. bspwm session only.
# Changes apply when picom restarts: pkill picom; picom &

backend = "glx";
vsync = true;

# Fullscreen windows (games, fullscreen video) skip picom entirely: no blur or fades there, but no extra
# input lag or GPU cost either. Windowed games still go through picom.
unredir-if-possible = true;

# Blur: whatever shows through a see-through window is blurred. Raise strength for more blur (1-20).
blur: {
  method = "dual_kawase";
  strength = 6;
};
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'"
];

# Rounded corners on windows (polybar, rofi and the volume slider round their own)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'menu'",
  "window_type = 'dropdown_menu'",
  "window_type = 'popup_menu'",
  "window_type = 'tooltip'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "class_g = 'Volume-popup'"
];

# Quick fade when windows open and close
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;

shadow = false;
detect-rounded-corners = true;
detect-client-opacity = true;
# Redraw the whole screen every frame. Repainting only the changed parts (true) leaves stale pictures on NVIDIA,
# e.g. a switched-to workspace still showing the previous one.
use-damage = false;
