# Theme settings for apps in the bspwm session (Cinnamon hands these out itself). Same values as Cinnamon.
Net/ThemeName "Gruvbox-Orange-Dark"
Net/IconThemeName "Gruvbox-Tan"
Gtk/CursorThemeName "Bibata-Modern-Classic"
Gtk/FontName "Ubuntu 10"
Xft/Antialias 1
Xft/Hinting 1
Xft/HintStyle "hintslight"
Xft/RGBA "rgb"
