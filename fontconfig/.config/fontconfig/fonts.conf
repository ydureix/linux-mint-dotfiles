<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Font smoothing for an OLED monitor. Mint's default (sub-pixel "rgb", in /etc/fonts/conf.d) colours the edges of
     letters for monitors whose pixels are red, green, blue stripes side by side. OLED pixels are laid out
     differently (triangles or RWBG), so that colouring shows up as blurry, red/blue-fringed text. Grey smoothing
     works with any pixel layout. Apps that ask Cinnamon or xsettingsd use the same setting from there
     (bspwm/.config/xsettingsd/xsettingsd.conf, and Cinnamon's antialiasing = grayscale). -->
<fontconfig>
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcdnone</const></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
  </match>
</fontconfig>
