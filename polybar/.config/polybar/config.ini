; Polybar — Gruvbox top bar for Cinnamon. Colours are #AARRGGBB (first two digits = opacity, CC ≈ 80%).
; Docs: https://github.com/polybar/polybar/wiki

[colors]
; Exact Gruvbox colours: solid dark0-hard background, tan (fg2) text.
background = #FF1d2021
background-alt = #3c3836
tan = #d5c4a1
foreground = ${self.tan}
dark = #1d2021
grey = #a89984
red = #fb4934
green = #87bd89

[bar/main]
; No monitor name: the port name (DP-0, DP-2…) can change between boots, so use the primary screen.
;monitor = DP-0
; Only as wide as its contents (about 360 px) plus some room, centred, so the green border wraps just them.
; If icons or workspaces get cut off, raise width and keep offset-x at half of it.
width = 420
offset-x = 50%:-210
height = 30
padding-left = 1
padding-right = 2
module-margin = 1
; Gruvbox aqua-green outline (the colour VS Code's Gruvbox theme uses for selections)
border-size = 2
radius-bottom = 10
border-color = ${colors.green}
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Ubuntu:size=10;2
font-1 = Noto Sans Symbols2:size=10;2
font-2 = Ubuntu:size=12:weight=bold;2
separator = |
separator-foreground = ${colors.grey}
; Everything sits together in the middle of the bar
modules-center = workspaces date memory cpu tray
cursor-click = pointer
enable-ipc = true

; Cinnamon's workspaces as Gruvbox orange dots: ● the current one, ○ the others.
; Switching fades between them. Click a dot to switch. Script: ~/.local/bin/polybar-workspaces
[module/workspaces]
type = custom/script
exec = ~/.local/bin/polybar-workspaces
tail = true

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.tan}
label-font = 3

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.tan}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "CPU "
format-prefix-foreground = ${colors.tan}
label = %percentage%%

; System tray: Wi-Fi (nm-applet), volume (pasystray), Bluetooth, updates… Click an icon for its menu.
; launch.sh starts the Wi-Fi and volume apps. Cinnamon's panel is turned off, so polybar holds the tray.
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 60%

[settings]
screenchange-reload = true
