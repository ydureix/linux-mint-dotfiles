; Polybar — Gruvbox top bar for Cinnamon. Colours are #AARRGGBB (first two digits = opacity, CC ≈ 80%).
; Docs: https://github.com/polybar/polybar/wiki

[colors]
; Exact Gruvbox colours: solid dark0-hard background, tan (fg2) text.
background = #FF1d2021
background-alt = #3c3836
tan = #d5c4a1
foreground = ${self.tan}
dark = #1d2021
grey = #a89984
red = #fb4934
green = #87bd89

[bar/main]
; No monitor name: the port name (DP-0, DP-2…) can change between boots, so use the primary screen.
;monitor = DP-0
; A fixed-width box in the middle of the top edge, so the green border and rounded bottom wrap just the contents.
; Polybar can't size a bar to its contents (and a box drawn inside a bar can't have rounded corners),
; so this width is set by hand. If something gets cut off,
; raise width and set offset-x to minus half of it.
width = 740
offset-x = 50%:-370
height = 30
padding-left = 3
padding-right = 3
; Even 22 px gap between every section (11 px on each side), the same as between the power buttons. No | dividers.
module-margin = 11px
; Gruvbox aqua-green outline (the colour VS Code's Gruvbox theme uses for selections), rounded at the bottom
border-size = 2
radius-bottom = 10
border-color = ${colors.green}
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = DejaVu Sans:size=10;2
font-1 = Noto Sans Symbols2:size=10;2
font-2 = DejaVu Sans:size=12:weight=bold;2
; Icons for Wi-Fi, volume and the power buttons (Symbols Nerd Font, installed in ~/.local/share/fonts).
; size 10 matches the text height exactly; 12 is a little bigger. The number after ";" nudges them down (raise it if icons sit too high).
font-3 = Symbols Nerd Font:size=12;2
; Workspace dots, RAM and CPU on the left, the clock always in the centre, power mode, Wi-Fi, volume and power buttons on the right.
; No tray: apps can't add icons. Wi-Fi and volume are polybar's own modules.
modules-left = workspaces memory cpu
modules-center = date
modules-right = powermode wifi volume power
cursor-click = pointer
; "bspwm" when running under bspwm (set by launch.sh) so fullscreen windows cover the bar; empty in Cinnamon
wm-restack = ${env:POLYBAR_WM_RESTACK:}
enable-ipc = true

; Cinnamon's workspaces as Gruvbox orange dots: ● the current one, ○ the others.
; Switching fades between them. Click a dot to switch. Script: ~/.local/bin/polybar-workspaces
[module/workspaces]
type = custom/script
exec = ~/.local/bin/polybar-workspaces
tail = true

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.tan}
label-font = 3

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.tan}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "CPU "
format-prefix-foreground = ${colors.tan}
label = %percentage%%

; Power mode: speedometer = performance, scales = balanced, leaf = power saver. Updates instantly when the mode
; changes. Click for a drop-down of every mode this system offers. Scripts: ~/.local/bin/polybar-power-mode
; (the icon) and ~/.local/bin/power-mode-popup (the drop-down).
[module/powermode]
type = custom/script
exec = ~/.local/bin/polybar-power-mode
tail = true
click-left = ~/.local/bin/power-mode-popup &

; Wi-Fi: just the signal-strength icon (the network name shows in the drop-down), or a crossed-out icon in grey when off.
; Click for a drop-down of nearby networks (~/.local/bin/wifi-popup).
[module/wifi]
type = internal/network
interface-type = wireless
interval = 3
format-connected = %{A1:~/.local/bin/wifi-popup &:}<ramp-signal>%{A}
ramp-signal-0 = 󰤟
ramp-signal-1 = 󰤢
ramp-signal-2 = 󰤥
ramp-signal-3 = 󰤨
ramp-signal-font = 4
format-disconnected = %{A1:~/.local/bin/wifi-popup &:}<label-disconnected>%{A}
label-disconnected = 󰖪
label-disconnected-font = 4
label-disconnected-foreground = ${colors.grey}

; Volume: just a speaker icon (fuller as it gets louder, grey and crossed out when muted).
; Click for the drop-down slider, scroll to change, middle-click to mute, right-click for the full mixer.
; Scripts: ~/.local/bin/polybar-volume (the icon) and ~/.local/bin/volume-popup (the slider).
[module/volume]
type = custom/script
exec = ~/.local/bin/polybar-volume
tail = true
click-left = ~/.local/bin/volume-popup &
click-middle = pactl set-sink-mute @DEFAULT_SINK@ toggle
click-right = pavucontrol &
scroll-up = ~/.local/bin/polybar-volume up
scroll-down = ~/.local/bin/polybar-volume down

; Log out, Sleep and Power off icons (size: font-3; gap between them: the %{O22} = 22 px, same as module-margin x 2).
; Clicking one does it straight away, with no "are you sure?".
; Log out ends whichever session is running: bspwm (bspc quit) or Cinnamon.
[module/power]
type = custom/text
format = %{A1:bspc quit || cinnamon-session-quit --logout --no-prompt:}%{T4}󰍃%{T-}%{A}%{O22}%{A1:systemctl suspend:}%{T4}󰒲%{T-}%{A}%{O22}%{A1:systemctl poweroff:}%{T4}󰐥%{T-}%{A}

[settings]
screenchange-reload = true
