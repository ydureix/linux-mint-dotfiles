; Polybar — Gruvbox top bar for Cinnamon. Colours are #AARRGGBB (first two digits = opacity, CC ≈ 80%).
; Docs: https://github.com/polybar/polybar/wiki

[colors]
; Exact Gruvbox colours: solid dark0-hard background, tan (fg2) text.
background = #FF1d2021
background-alt = #3c3836
tan = #d5c4a1
foreground = ${self.tan}
dark = #1d2021
grey = #a89984
red = #fb4934
green = #b8bb26

[bar/main]
; No monitor name: the port name (DP-0, DP-2…) can change between boots, so use the primary screen.
;monitor = DP-0
width = 100%
height = 30
padding-left = 1
padding-right = 2
module-margin = 1
background = ${colors.background}
foreground = ${colors.foreground}
font-0 = Ubuntu:size=10;2
font-1 = Noto Sans Symbols2:size=10;2
separator = |
separator-foreground = ${colors.grey}
modules-left = xworkspaces xwindow
modules-center = date
modules-right = memory cpu tray
cursor-click = pointer
enable-ipc = true

; Cinnamon's workspaces: current one as a tan tab, ones with windows in tan, empty ones in grey. Click to switch.
[module/xworkspaces]
type = internal/xworkspaces
enable-scroll = false
label-active = %index%
label-active-background = ${colors.tan}
label-active-foreground = ${colors.dark}
label-active-padding = 1
label-occupied = %index%
label-occupied-foreground = ${colors.foreground}
label-occupied-padding = 1
label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.dark}
label-urgent-padding = 1
label-empty = %index%
label-empty-foreground = ${colors.grey}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:50:…%

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.tan}

[module/memory]
type = internal/memory
interval = 3
format-prefix = "RAM "
format-prefix-foreground = ${colors.tan}
label = %percentage_used%%

[module/cpu]
type = internal/cpu
interval = 3
format-prefix = "CPU "
format-prefix-foreground = ${colors.tan}
label = %percentage%%

; System tray: Wi-Fi (nm-applet), volume (pasystray), Bluetooth, updates… Click an icon for its menu.
; launch.sh starts the Wi-Fi and volume apps. Cinnamon's panel is turned off, so polybar holds the tray.
[module/tray]
type = internal/tray
tray-spacing = 8px
tray-size = 60%

[settings]
screenchange-reload = true
